# Blueprint de Render: backend (API + ejecutor Java) en el plan gratis (0,1 CPU, 512 MB).
# Los secretos (sync: false) se piden al crear el Blueprint y nunca se guardan en el repositorio.
services:
  - type: web
    name: dualdev-api
    runtime: docker
    plan: free
    region: virginia
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # URL del frontend en Vercel, p. ej. https://dualdev.vercel.app (sin "/" al final).
      - key: CORS_ORIGIN
        sync: false
      # RUNNER_SANDBOX_UID/GID no van aquí: ya quedan fijos en el Dockerfile (10001/10001), junto con
      # el usuario "sandbox" que de verdad usa esos ids.
      # Servidor de 0,1 CPU: un envío a la vez, un caso a la vez y tiempos holgados para que un
      # programa correcto no se confunda con un ciclo infinito.
      - key: RUNNER_CONCURRENCIA
        value: "1"
      - key: RUNNER_CASOS_EN_PARALELO
        value: "1"
      - key: RUNNER_COMPILACION_MS
        value: "30000"
      - key: RUNNER_EJECUCION_MS
        value: "8000"
